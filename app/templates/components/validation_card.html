<div class="validation-card">
  <div style="font-size:0.8125rem; font-weight:700; color:#166534; margin-bottom:0.5rem; text-transform:uppercase; letter-spacing:0.05em;">
    Verification & Validation
  </div>
  <ul class="validation-list">
    {% if message.validation %}
      {% for v in message.validation %}
        <li class="validation-item">
          <span style="color: {% if v.passed %}#16A34A{% else %}#DC2626{% endif %}; font-weight:700;">
            {% if v.passed %}✓{% else %}✗{% endif %}
          </span>
          <span><b>{{ v.check }}</b>: {{ v.detail }}</span>
        </li>
      {% endfor %}
    {% else %}
      <li class="validation-item">
        <span>✓</span>
        <span>Calculations and schema verified against underlying data.</span>
      </li>
    {% endif %}
  </ul>
</div>
