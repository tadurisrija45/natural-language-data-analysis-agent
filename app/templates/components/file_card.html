<div class="file-preview-item">
  <div style="display:flex; align-items:center; gap:0.75rem;">
    <span style="color:#0F766E; font-weight:700;">✓</span>
    <div>
      <div style="font-weight:600; color:#0F172A;">{{ file.filename }}</div>
      <div style="font-size:0.75rem; color:#64748B;">
        {{ file.file_type.upper() }} &bull; {{ format_datetime(file.created_at) }}
      </div>
    </div>
  </div>
  <div style="font-weight:500; font-size:0.8125rem; color:#64748B;">
    {{ format_file_size(file.file_size) }}
  </div>
</div>
