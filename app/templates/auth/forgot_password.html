{% extends 'base.html' %}

{% block title %}Reset Password - {{ BRAND_NAME }}{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
{% endblock %}

{% block auth_content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <img src="{{ url_for('static', filename='images/logo.svg') }}" alt="{{ BRAND_NAME }}" class="auth-logo">
      <div class="auth-brand">{{ BRAND_NAME }}</div>
      <div class="auth-tagline">{{ BRAND_TAGLINE }}</div>
      <div class="auth-heading">Reset your password</div>
    </div>

    <form method="POST" action="{{ url_for('auth.forgot_password') }}">
      <div class="form-group">
        <label for="identifier" class="form-label">Username or email</label>
        <input type="text" id="identifier" name="identifier" class="form-control" value="{{ identifier or '' }}" required autofocus placeholder="Enter your username or email">
      </div>

      <div class="form-group">
        <label for="new_password" class="form-label">New Password</label>
        <input type="password" id="new_password" name="new_password" class="form-control" required placeholder="Minimum 6 characters">
      </div>

      <div class="form-group">
        <label for="confirm_password" class="form-label">Confirm New Password</label>
        <input type="password" id="confirm_password" name="confirm_password" class="form-control" required placeholder="Confirm new password">
      </div>

      <button type="submit" class="btn btn-primary auth-submit-btn">Reset Password</button>

      <div class="auth-footer center">
        <span>Remembered your password?</span>
        <a href="{{ url_for('auth.login') }}">Back to log in</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
