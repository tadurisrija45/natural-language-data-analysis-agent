{% extends 'base.html' %}

{% block title %}Log in - {{ BRAND_NAME }}{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
{% endblock %}

{% block auth_content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <img src="{{ url_for('static', filename='images/logo.svg') }}" alt="{{ BRAND_NAME }}" class="auth-logo">
      <div class="auth-brand">{{ BRAND_NAME }}</div>
      <div class="auth-tagline">{{ BRAND_TAGLINE }}</div>
      <div class="auth-heading">Welcome back</div>
    </div>

    <form method="POST" action="{{ url_for('auth.login') }}">
      <div class="form-group">
        <label for="identifier" class="form-label">Username or email</label>
        <input type="text" id="identifier" name="identifier" class="form-control" value="{{ identifier or '' }}" required autofocus placeholder="Enter your username or email">
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" name="password" class="form-control" required placeholder="Enter your password">
      </div>

      <button type="submit" class="btn btn-primary auth-submit-btn">Log in</button>

      <div class="auth-footer">
        <a href="{{ url_for('auth.forgot_password') }}">Forgot password?</a>
        <a href="{{ url_for('auth.signup') }}">Create account</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
